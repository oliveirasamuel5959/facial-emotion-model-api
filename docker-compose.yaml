version: "3.9"
services:
  model-service:
    build:
      context: ./model_service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    image: model-service:v1.0
    networks:
      - webnet
    volumes:
    - ./model_service:/app
    restart: on-failure

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    image: main-app:v1.0
    networks:
      - webnet
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - webnet
    restart: unless-stopped
    depends_on:
      - app
      - model-service

  cloudflare:
    container_name: cloudflaretunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
    ipam:
      config:
        - subnet: "172.19.1.0/24"
          gateway: "172.19.1.1"

