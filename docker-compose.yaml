version: "3.9"
services:
  model-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    image: model-service:v1.0
    networks:
      - webnet
    volumes:
    - ./backend:/app
    restart: on-failure

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    image: webapp:v1.0
    networks:
      - webnet
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules 
    env_file:
      - .env
    stdin_open: true
    environment:
    - NODE_ENV=development
    - CHOKIDAR_USEPOLLING=true

  postgres:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - webnet

  nginx:
    image: nginx:stable-alpine
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - webnet
    restart: unless-stopped
    depends_on:
      - web
      - model-service

  cloudflare:
    container_name: cloudflaretunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - webnet

networks:
  webnet:

