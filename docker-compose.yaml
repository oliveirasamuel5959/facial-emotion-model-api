version: "3.9"
services:
  model-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    image: model-service:v1.0
    networks:
      - webnet
    volumes:
    - ./backend:/app
    restart: on-failure

  # app:
  #   build:
  #     context: ./code
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8501:8501"
  #   image: main-app:v1.0
  #   networks:
  #     - webnet
  #   restart: always

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    image: webapp:v1.0
    networks:
      - webnet
    volumes:
      - ./frontend:/frontend
      - ./frontend/node_modules:/frontend/node_modules
    env_file:
      - .env
    stdin_open: true
    

  nginx:
    image: nginx:stable-alpine
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - webnet
    restart: unless-stopped
    depends_on:
      - web
      - model-service

  cloudflare:
    container_name: cloudflaretunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - webnet

networks:
  webnet:

